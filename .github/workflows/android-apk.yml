

name: Build DriveGo APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRORE: non trovo il file ZIP del progetto nella root."
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name package.json -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "ERRORE: non trovo package.json nel progetto ZIP."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.2"

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Build UserApp APK
        working-directory: ${{ github.workspace }}
        run: |
          cd "$PROJECT_ROOT/UserApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build DriverApp APK
        working-directory: ${{ github.workspace }}
        run: |
          cd "$PROJECT_ROOT/DriverApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DriveGo-APKs
          path: |
            extracted/**/UserApp/android/app/build/outputs/apk/debug/*.apk
            extracted/**/DriverApp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
