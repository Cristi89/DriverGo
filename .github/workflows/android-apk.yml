name: Build DriveGo APKs

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Extract project ZIP
    shell: bash
    run: |
      set -e
      mkdir -p extracted

      ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
      if [ -z "$ZIP" ]; then
        echo "ERRORE: nessun file ZIP trovato nella root del repository."
        exit 1
      fi

      unzip -q "$ZIP" -d extracted

      USERAPP="$(find extracted -type d -name UserApp | head -n 1)"
      DRIVERAPP="$(find extracted -type d -name DriverApp | head -n 1)"

      if [ -z "$USERAPP" ] || [ -z "$DRIVERAPP" ]; then
        echo "ERRORE: non trovo entrambe le cartelle UserApp e DriverApp."
        find extracted -maxdepth 4 -type d
        exit 1
      fi

      PROJECT_ROOT="$(dirname "$USERAPP")"

      echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      echo "USERAPP=$USERAPP" >> "$GITHUB_ENV"
      echo "DRIVERAPP=$DRIVERAPP" >> "$GITHUB_ENV"

      echo "Progetto trovato: $PROJECT_ROOT"
      echo "UserApp: $USERAPP"
      echo "DriverApp: $DRIVERAPP"

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      cache: ''

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: ''

  - name: Install Android packages
    run: |
      sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.2"

  - name: Install Yarn
    run: npm install --global yarn@1.22.22

  - name: Prepare legacy Gradle repositories
    shell: bash
    run: |
      set -e
      for APP in "$USERAPP" "$DRIVERAPP"; do
        if [ -f "$APP/android/build.gradle" ]; then
          sed -i '/jcenter()/a\        mavenCentral()' "$APP/android/build.gradle"
        fi

        if [ -f "$APP/android/app/build.gradle" ]; then
          sed -i '/jcenter()/a\        mavenCentral()' "$APP/android/app/build.gradle"
        fi
      done

  - name: Build UserApp APK
    shell: bash
    run: |
      set -e
      cd "$USERAPP"
      yarn install --frozen-lockfile

      cd android
      chmod +x gradlew

      export JAVA_HOME="$JAVA_HOME_11_X64"
      export PATH="$JAVA_HOME/bin:$PATH"

      ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Build DriverApp APK
    shell: bash
    run: |
      set -e
      cd "$DRIVERAPP"
      yarn install --frozen-lockfile

      cd android
      chmod +x gradlew

      export JAVA_HOME="$JAVA_HOME_11_X64"
      export PATH="$JAVA_HOME/bin:$PATH"

      ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Upload APKs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: DriveGo-APKs
      path: |
        extracted/**/UserApp/android/app/build/outputs/apk/debug/*.apk
        extracted/**/DriverApp/android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: warn
      retention-days: 14
