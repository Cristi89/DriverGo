name: Build DriveGo APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRORE: nessun file ZIP trovato nella root."
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -type d -name UserApp -print -quit)

          if [ -z "$ROOT" ] || [ ! -d "$ROOT/DriverApp" ]; then
            echo "ERRORE: non trovo UserApp e DriverApp nella stessa cartella."
            find extracted -maxdepth 5 -type d
            exit 1
          fi

          echo "PROJECT_ROOT=$(dirname "$ROOT")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.2"

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Build UserApp APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT/UserApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build DriverApp APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT/DriverApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DriveGo-APKs
          path: |
            extracted/**/UserApp/android/app/build/outputs/apk/debug/*.apk
            extracted/**/DriverApp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
