name: Build DriveGo APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRORE: nessun file ZIP trovato nella root del repository."
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name package.json -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "ERRORE: package.json non trovato nello ZIP."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-29
            build-tools;29.0.2

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Build UserApp APK
        run: |
          cd "$PROJECT_ROOT/UserApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build DriverApp APK
        run: |
          cd "$PROJECT_ROOT/DriverApp"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DriveGo-APKs
          path: |
            extracted/**/UserApp/android/app/build/outputs/apk/debug/*.apk
            extracted/**/DriverApp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
