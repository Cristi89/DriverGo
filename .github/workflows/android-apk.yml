name: Build DriveGo APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          ZIP="DriveGo-MVP-v2-apk-build-ready.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: file ZIP del progetto non trovato."
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          USERAPP="$(find extracted -type d -name UserApp -print -quit)"
          DRIVERAPP="$(find extracted -type d -name DriverApp -print -quit)"

          if [ -z "$USERAPP" ] || [ -z "$DRIVERAPP" ]; then
            echo "ERROR: UserApp o DriverApp non trovata."
            find extracted -maxdepth 5 -type d
            exit 1
          fi

          echo "USERAPP=$USERAPP" >> "$GITHUB_ENV"
          echo "DRIVERAPP=$DRIVERAPP" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.2" "ndk;21.4.7075529"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Build UserApp APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$USERAPP"
          yarn install --frozen-lockfile

          if [ -f android/gradle.properties ]; then
            sed -i 's/^FLIPPER_VERSION=.*/FLIPPER_VERSION=0.99.0/' android/gradle.properties
          fi

          cd android
          chmod +x gradlew
          printf 'sdk.dir=%s\nndk.dir=%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME/ndk/21.4.7075529" > local.properties

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build DriverApp APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$DRIVERAPP"
          yarn install --frozen-lockfile

          if [ -f android/gradle.properties ]; then
            sed -i 's/^FLIPPER_VERSION=.*/FLIPPER_VERSION=0.99.0/' android/gradle.properties
          fi

          cd android
          chmod +x gradlew
          printf 'sdk.dir=%s\nndk.dir=%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME/ndk/21.4.7075529" > local.properties

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output

          find extracted -type f -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -maxdepth 1 -name '*.apk' | grep -q .; then
            echo "ERROR: nessun APK generato."
            exit 1
          fi

          ls -lh apk-output

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriveGo-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
