name: Build DriveGo APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRORE: nessun file ZIP trovato."
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          USERAPP="$(find extracted -type d -name UserApp | head -n 1)"
          DRIVERAPP="$(find extracted -type d -name DriverApp | head -n 1)"

          if [ -z "$USERAPP" ] || [ -z "$DRIVERAPP" ]; then
            echo "ERRORE: cartelle UserApp o DriverApp mancanti."
            find extracted -maxdepth 5 -type d
            exit 1
          fi

          echo "USERAPP=$USERAPP" >> "$GITHUB_ENV"
          echo "DRIVERAPP=$DRIVERAPP" >> "$GITHUB_ENV"

      - name: Setup Java 11 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.2"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Build UserApp APK
        shell: bash
        run: |
          set -e
          cd "$USERAPP"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon assembleDebug

      - name: Build DriverApp APK
        shell: bash
        run: |
          set -e
          cd "$DRIVERAPP"
          yarn install --frozen-lockfile
          cd android
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK files
        if: always()
        shell: bash
        run: |
          mkdir -p apk-output
          find extracted -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -exec cp --parents {} apk-output/ \; || true
          find apk-output -type f -name '*.apk' || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DriveGo-APKs
          path: apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 14
